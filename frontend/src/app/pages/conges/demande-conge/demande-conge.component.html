<form [formGroup]="form" (ngSubmit)="submit()">
    <label>ID Employé : <input formControlName="employeeId" /></label>
    <span class="error">{{ errorMessage('employeeId') }}</span>
    <label>Date Début : <input type="date" formControlName="startDate" /></label>
    <span class="error">{{ errorMessage('startDate') }}</span>
    <label>Date Fin : <input type="date" formControlName="endDate" /></label>
    <span class="error">{{ errorMessage('endDate') }}</span>
    <label>Type :
      <select formControlName="leaveType">
        <option value="CONGE_PAYE">Congé payé</option>
        <option value="RTT">RTT</option>
        <option value="SANS_SOLDE">Sans solde</option>
      </select>
    </label>
    <span class="error">{{ errorMessage('leaveType') }}</span>
    <button type="submit" [disabled]="form.invalid">Envoyer</button>
    <button type="button" (click)="init()">Réinitialiser</button>
  </form>
  <p [ngClass]="error ? 'error' : ''">{{ message }}</p>
