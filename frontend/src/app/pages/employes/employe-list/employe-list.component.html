<h2>Cadres</h2>
<ul>
  <li *ngFor="let employe of cadres">
    {{ employe.prenom }} {{ employe.nom }}
    <a [routerLink]="['/employees', employe.id]">Détails</a>
  </li>
</ul>
<h2>Non-Cadres</h2>
<ul>
  <li *ngFor="let employe of nonCadres">
    {{ employe.prenom }} {{ employe.nom }}
    <a [routerLink]="['/employees', employe.id]">Détails</a>
  </li>
</ul>
