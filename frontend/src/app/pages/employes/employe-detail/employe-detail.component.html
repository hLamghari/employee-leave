<div *ngIf="employe">
    <h2>{{ employe.prenom }} {{ employe.nom }}</h2>
    <p>Catégorie : {{ employe.categorie }}</p>
    <p>Date d'embauche : {{ employe.dateEmbauche }}</p>
    <p>Solde congés : {{ employe.soldeConges }}</p>
    <p *ngIf="employe.soldeRTT">Solde RTT : {{ employe.soldeRTT }}</p>
    <conge-list [emplyeeId]="employe.id"></conge-list>
</div>
