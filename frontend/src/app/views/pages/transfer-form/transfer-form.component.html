<div class="flex justify-center items-center min-h-screen bg-gray-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-lg">
        <h2 class="text-3xl font-bold mb-8 text-blue-700 flex items-center">
            <svg class="w-8 h-8 mr-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 9V7a5 5 0 00-10 0v2a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2v-7a2 2 0 00-2-2z" />
            </svg>
            Make a Transfer
        </h2>

        <form [formGroup]="transferForm" (ngSubmit)="onSubmit()" novalidate>
            <!-- Source Account -->
            <div class="mb-6">
                <label class="block text-lg font-medium text-gray-700 mb-2">Source Account</label>
                <select formControlName="sourceAccountId"
                    class="block w-full rounded border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-lg py-2">
                    <option [ngValue]="null">Select source account</option>
                    <option *ngFor="let acc of accounts" [ngValue]="acc.id">
                        {{ acc.nom }} ({{ acc.iban }})
                    </option>
                </select>
                <div *ngIf="transferForm.get('sourceAccountId')?.touched && transferForm.get('sourceAccountId')?.invalid"
                    class="text-red-600 text-base mt-1">Source account is required.</div>
            </div>

            <!-- Destination Account -->
            <div class="mb-6">
                <label class="block text-lg font-medium text-gray-700 mb-2">Destination Account</label>
                <select formControlName="destinationAccountId"
                    class="block w-full rounded border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-lg py-2">
                    <option [ngValue]="null">Select destination account</option>
                    <option *ngFor="let acc of accounts" [ngValue]="acc.id">
                        {{ acc.nom }} ({{ acc.iban }})
                    </option>
                </select>
                <div *ngIf="transferForm.get('destinationAccountId')?.touched && transferForm.get('destinationAccountId')?.invalid"
                    class="text-red-600 text-base mt-1">Destination account is required.</div>
            </div>

            <!-- Amount -->
            <div class="mb-6">
                <label class="block text-lg font-medium text-gray-700 mb-2">Amount</label>
                <input type="number" step="0.01" min="0.01" formControlName="amount"
                    class="block w-full rounded border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-lg py-2" />
                <div *ngIf="transferForm.get('amount')?.touched && transferForm.get('amount')?.invalid"
                    class="text-red-600 text-base mt-1">Amount must be greater than 0.</div>
            </div>

            <!-- Execution Date -->
            <div class="mb-6">
                <label class="block text-lg font-medium text-gray-700 mb-2">Execution Date</label>
                <input type="date" formControlName="executionDate"
                    class="block w-full rounded border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-lg py-2" />
                <div *ngIf="transferForm.get('executionDate')?.touched && transferForm.get('executionDate')?.invalid"
                    class="text-red-600 text-base mt-1">Execution date is required.</div>
            </div>
            

            <!-- Periodicity -->
            <div class="mb-8">
                <label class="block text-lg font-medium text-gray-700 mb-2">Periodicity</label>
                <select formControlName="periodicite"
                    class="block w-full rounded border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-lg py-2">
                    <option [ngValue]="null">One-time</option>
                    <option value="MENSUEL">Monthly</option>
                    <option value="ANNUEL">Yearly</option>
                </select>
            </div>

            <!-- Error Messages -->
            <div *ngIf="formError" class="bg-red-100 text-red-800 p-3 rounded mb-4 text-lg text-center">{{ formError }}
            </div>
            <div *ngIf="backendError" class="bg-red-100 text-red-800 p-3 rounded mb-4 text-lg text-center">
                {{ backendError }}
            </div>
            <div *ngIf="successMessage" class="bg-green-100 text-green-800 p-3 rounded mb-4 text-lg text-center">{{
                successMessage }}</div>

            <button type="submit"
                class="w-full py-3 px-4 bg-blue-600 text-white text-lg font-semibold rounded hover:bg-blue-700 transition"
                [disabled]="isSubmitting">
                {{ isSubmitting ? 'Processing...' : 'Submit Transfer' }}
            </button>
        </form>
    </div>
</div>
