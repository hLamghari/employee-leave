<ng-template [ngIf]="isLoading">
    <app-loading></app-loading>
  </ng-template>
  
  <ng-template [ngIf]="loadingError">
    <app-loading-error></app-loading-error>
  </ng-template>
  
  <ng-template [ngIf]="authError">
    <app-auth-error></app-auth-error>
  </ng-template>
  
  <div class="container mx-auto py-12 grid grid-cols-1 md:grid-cols-2 gap-12">
    <!-- Current Accounts Card -->
    <div class="bg-white rounded-lg shadow-md p-10">
      <h2 class="text-4xl font-bold mb-8 text-blue-700 flex items-center">
        <svg class="w-10 h-10 mr-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 6h18M3 14h18M3 18h18" />
        </svg>
        Current Accounts
      </h2>
      <ul class="divide-y divide-gray-200">
        <li *ngFor="let account of groupedAccounts.currentAccounts"
            class="py-6 flex items-center cursor-pointer hover:bg-blue-50 transition"
            [routerLink]="['/accounts', account.id]">
          <div class="flex-1">
            <div class="font-bold text-2xl text-gray-900">{{ account.nom }}</div>
            <div class="text-lg text-gray-500">IBAN: {{ account.iban }}</div>
            <div class="text-lg text-gray-500">
              Amount: <span class="font-bold text-green-700">{{ account.amount }}</span>
            </div>
          </div>
          <span class="inline-block bg-blue-100 text-blue-800 text-base px-3 py-1 rounded ml-6">Current</span>
        </li>
      </ul>
    </div>
  
    <!-- Savings Accounts Card -->
    <div class="bg-white rounded-lg shadow-md p-10">
      <h2 class="text-4xl font-bold mb-8 text-green-700 flex items-center">
        <svg class="w-10 h-10 mr-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-3.866 0-7 1.343-7 3v5a2 2 0 002 2h10a2 2 0 002-2v-5c0-1.657-3.134-3-7-3z" />
          <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        Savings Accounts
      </h2>
      <ul class="divide-y divide-gray-200">
        <li *ngFor="let account of groupedAccounts.savingsAccounts"
            class="py-6 flex items-center cursor-pointer hover:bg-green-50 transition"
            [routerLink]="['/accounts', account.id]">
          <div class="flex-1">
            <div class="font-bold text-2xl text-gray-900">{{ account.nom }}</div>
            <div class="text-lg text-gray-500">IBAN: {{ account.iban }}</div>
            <div class="text-lg text-gray-500">
              Amount: <span class="font-bold text-green-700">{{ account.amount }}</span>
            </div>
            <div class="text-lg text-gray-500">
              Interest Rate: <span class="text-green-700">{{ account.tauxInteret }}%</span>
            </div>
          </div>
          <span class="inline-block bg-green-100 text-green-800 text-base px-3 py-1 rounded ml-6">Savings</span>
        </li>
      </ul>
    </div>
  </div>
