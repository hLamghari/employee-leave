<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
      <h5 class="text-gray-600 font-normal mb-6 text-center">
        Enter your email and password to access your account
      </h5>
  
      <form [formGroup]="loginForm" (ngSubmit)="onLoggedin()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Email"
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-red-500 text-sm mt-1">
            <div *ngIf="loginForm.get('email')?.hasError('required')">Email is required</div>
            <div *ngIf="loginForm.get('email')?.hasError('email')">Invalid email address</div>
          </div>
        </div>
  
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            formControlName="password"
            placeholder="Password"
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-500 text-sm mt-1">
            <div *ngIf="loginForm.get('password')?.hasError('required')">Password is required</div>
            <div *ngIf="loginForm.get('password')?.hasError('minlength')">Password must be at least 8 characters long</div>
          </div>
        </div>
  
        <button
          type="submit"
          [disabled]="loginBtnLoading"
          [class.opacity-50]="loginBtnLoading"
          class="w-full bg-blue-600 text-white py-2 rounded-xl hover:bg-blue-700 transition duration-300"
        >
          {{ loginBtnLoading ? 'Loading...' : 'Login' }}
        </button>
      </form>
    </div>
  </div>
